<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Discord Hangout Space</title>
    <!-- bumped with client/package.json on each release: the models' URLs carry it too (src/assetVersion.ts) -->
    <meta name="cozycube-version" content="0.6.13" />
    <style>
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #faf6ee; }
      /* the app keeps clear of a phone's notch and of Discord's own overlays: the safe area */
      #root { box-sizing: border-box; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
